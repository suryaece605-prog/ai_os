name: Build AI OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the ISO inside a Debian trixie container
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie \
            bash iso/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aios-iso
          path: iso/build/*.iso
          if-no-files-found: error
